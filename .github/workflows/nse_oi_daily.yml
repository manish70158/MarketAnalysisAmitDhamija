name: NSE Participant OI Daily Report

on:
  schedule:
    # 9 PM IST = 15:30 UTC (Mon-Fri, NSE closed on weekends)
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write  # Required to commit and push files

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate NSE Participant OI report
        run: python nse_participant_oi_horizontal.py

      - name: Generate market prediction
        run: python predict_market_view.py
        continue-on-error: true

      - name: Commit prediction history and data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prediction_history.json participant_oi_*.csv market_prediction.json 2>/dev/null || true
          if ! git diff --quiet --staged; then
            git commit -m "📊 Daily update: prediction history + NSE data - $(date +'%d %b %Y')"
            git push
          else
            echo "No changes to commit"
          fi
        continue-on-error: true

      - name: Send reports to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py
